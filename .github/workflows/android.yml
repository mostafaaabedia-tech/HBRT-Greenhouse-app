name: Build HBRT App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 5 uses Gradle 8.0, which does not run on Java 21 -> use Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Init Capacitor Project
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          npm init -y
          # All Capacitor packages pinned to the same major version
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/filesystem@5 @capacitor/share@5
          # Bundle the libraries so the app works with no internet connection
          npm install chart.js@4.4.1 jspdf@2.5.1
          cp node_modules/chart.js/dist/chart.umd.js www/lib/chart.umd.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/jspdf.umd.min.js
          npx cap init "HBRT AGRO" com.hbrt.agro --web-dir=www

      - name: Allow ws:// and http:// from the app
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.server={androidScheme:'http',cleartext:true};fs.writeFileSync(f,JSON.stringify(c,null,2));"

      - name: Add Android Platform
        run: npx cap add android

      - name: Force Allow Cleartext Traffic (ws:// fix)
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBRT-AGRO-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
